<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Einfaches Mini-Storyboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app bg-pale-blue" id="app">

    <!-- Scene 0: pale light blue + rolle.svg -->
    <section class="scene scene-0 visible" id="scene-0">
      <div class="center-wrap">
        <!-- adjustable size in styles.css -> .rolle -->
        <img src="grafiken/rolle.svg" alt="Rolle" class="rolle" id="rolle">
      </div>
    </section>

    <!-- Scene 1: papier -> zoom -> gold background -> map -> pin drop -->
    <section class="scene scene-1" id="scene-1">
      <div class="center-wrap" style="position:relative;">
        <img src="grafiken/papier.svg" alt="Papier" id="papier" class="papier">
        <img src="bilder/map.png" alt="Map" id="map" class="map" style="opacity:0;transition:opacity .6s ease;position:relative;z-index:1">
        <img src="grafiken/pin.svg" alt="Pin" id="pin" class="pin" style="z-index:2">
      </div>
    </section>

    <!-- Scene 2: white background with top wave bar and rocking boat + delayed heading -->
    <section class="scene scene-2" id="scene-2">
      <div class="top-bar">
        <img src="bilder/Welle.png" alt="Welle" class="welle">
      </div>
      <div class="center-wrap" style="flex-direction:column;">
        <img src="grafiken/boot.svg" alt="Boot" id="boat" class="boat">
        <h2 id="scene2-heading" style="margin-top:20px;opacity:0;transition:opacity .4s ease">Hier steht später ein Text</h2>
      </div>
    </section>

    <!-- Scene 3: pale blue background + anker drop -> captain & crew appear with captions; include steuerrad to be removed next -->
    <section class="scene scene-3" id="scene-3">
      <div class="center-wrap" style="flex-direction:column;">
        <img src="grafiken/anker.svg" alt="Anker" id="anker" class="anker">
        <div id="people" class="people-row" style="margin-top:18px;">
          <div class="person" id="person-left">
            <div class="caption" id="crew-caption" style="opacity:0">Crew</div>
            <img src="bilder/crew.png" alt="Crew" id="crew" style="opacity:0">
          </div>
          <div class="person" id="person-right">
            <div class="caption" id="captain-caption" style="opacity:0">Captain</div>
            <img src="bilder/captain.png" alt="Captain" id="captain" style="opacity:0">
          </div>
        </div>
        <img src="grafiken/steuerrad.svg" alt="Steuerrad" id="steuerrad" style="width:120px;margin-top:18px">
      </div>
    </section>

    <!-- Scene 4: show a heading and a row of three boats -->
    <section class="scene scene-4" id="scene-4">
      <div class="center-wrap" style="flex-direction:column;">
        <h2 id="scene4-heading">Unsere Boote</h2>
        <div class="boats-row" style="margin-top:18px">
          <img src="grafiken/boot.svg" alt="Boot">
          <img src="grafiken/ruderboot.svg" alt="Ruderboot">
          <img src="grafiken/segelboot.svg" alt="Segelboot">
        </div>
      </div>
    </section>

    <!-- Scene 5: blank white content area for further text/images -->
    <section class="scene scene-5" id="scene-5">
      <div class="final-content">
        <h2>Platz für weitere Inhalte</h2>
        <p>Hier kannst du zusätzlich Text, Bilder oder Links einfügen.</p>
      </div>
    </section>

  </div>

  <!-- persistent arrow button bottom-right -->
  <div class="corner-arrow" id="next-button" title="Weiter">
    <img src="grafiken/pfeil.svg" alt="Weiter">
  </div>

  <script src="main.js"></script>
</body>
</html>
